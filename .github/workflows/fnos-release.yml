name: Build and release fnOS FPK

on:
  push:
    branches: [main]
    paths:
      - server.js
      - epg.js
      - package.json
      - package-lock.json
      - 'public/**'
      - 'fnos/**'
      - '.github/workflows/fnos-release.yml'
      - '.gitattributes'
  workflow_dispatch:

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set release version
        run: echo "VERSION=1.0.$((GITHUB_RUN_NUMBER - 1))" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Download fnpack
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 -o "$RUNNER_TEMP/fnpack"
          echo "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93  $RUNNER_TEMP/fnpack" | sha256sum --check
          chmod +x "$RUNNER_TEMP/fnpack"
          echo "FNPACK=$RUNNER_TEMP/fnpack" >> "$GITHUB_ENV"
      - name: Build and inspect package
        run: |
          node --check server.js
          node --check epg.js
          node --check public/app.js
          bash -n fnos/main
          node fnos/build.mjs "$VERSION"
          cd dist
          package="IPTV-${VERSION}-fnOS.fpk"
          tar -tf "$package"
          sha256sum "$package" > "$package.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          gh release create "$tag" "dist/IPTV-${VERSION}-fnOS.fpk" "dist/IPTV-${VERSION}-fnOS.fpk.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "IPTV $VERSION" --generate-notes
