name: Build and release fnOS FPK

on:
  push:
    branches: [main]
    paths:
      - server.js
      - epg.js
      - package.json
      - package-lock.json
      - 'public/**'
      - 'fnos/**'
      - '.github/workflows/fnos-release.yml'
      - '.gitattributes'
  workflow_dispatch:

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set release version
        run: echo "VERSION=1.0.$((GITHUB_RUN_NUMBER - 1))" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci --omit=dev --no-bin-links
      - name: Download fnpack
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 -o "$RUNNER_TEMP/fnpack"
          echo "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93  $RUNNER_TEMP/fnpack" | sha256sum --check
          chmod +x "$RUNNER_TEMP/fnpack"
          echo "FNPACK=$RUNNER_TEMP/fnpack" >> "$GITHUB_ENV"
      - name: Build and inspect package
        run: |
          node --check server.js
          node --check epg.js
          node --check public/app.js
          bash -n fnos/main
          node fnos/build.mjs "$VERSION"
          cd dist
          package="IPTV-${VERSION}-fnOS.fpk"
          tar -tf "$package"
          tar -xf "$package" app.tgz
          tar -tvf app.tgz > app-contents.txt
          if grep -q '^l' app-contents.txt; then
            echo "The fnOS payload must not contain symbolic links" >&2
            exit 1
          fi
          sha256sum "$package" > "$package.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          previous=$(git describe --tags --match 'v[0-9]*' --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
          range="$GITHUB_SHA"
          if [ -n "$previous" ]; then range="$previous..$GITHUB_SHA"; fi
          {
            printf '## 本版改动\n\n'
            git log --format='- %s (%h)%n%b' "$range" -- . ':(exclude)logo/**'
            if [ -n "$previous" ]; then
              printf '\n[查看完整变更](https://github.com/%s/compare/%s...%s)\n' "$GITHUB_REPOSITORY" "$previous" "$tag"
            fi
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" "dist/IPTV-${VERSION}-fnOS.fpk" "dist/IPTV-${VERSION}-fnOS.fpk.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "IPTV $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
